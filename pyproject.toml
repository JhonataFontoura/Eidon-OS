[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eidon-os"
version = "0.4.0"
description = "Plataforma pessoal de gestão do conhecimento e inteligência de desenvolvimento."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Jhony Nunes" }]
dependencies = ["openpyxl>=3.1"]

[project.scripts]
eidon = "eidon_os.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
